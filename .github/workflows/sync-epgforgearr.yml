name: Sync EPGForgearr release

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v7

      - name: Read latest stable plugin release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --repo mildman1848/epgforgearr --json tagName,isPrerelease)
          tag=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert not d["isPrerelease"]; print(d["tagName"])' <<< "$release")
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="epgforgearr-${version}.zip"
          url="https://github.com/mildman1848/epgforgearr/releases/download/${tag}/${asset}"
          gh release download "$tag" --repo mildman1848/epgforgearr --pattern "$asset" --dir "$RUNNER_TEMP"
          hash=$(sha256sum "$RUNNER_TEMP/$asset" | cut -d ' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Update catalog entry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python3 scripts/update_epgforgearr_catalog.py \
            --version "$RELEASE_VERSION" \
            --url "$RELEASE_URL" \
            --sha256 "$RELEASE_SHA256"

      - name: Commit catalog update
        run: |
          if git diff --quiet -- catalog.json; then
            echo 'Catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m "chore: sync EPGForgearr release ${{ steps.release.outputs.version }}"
          git push
