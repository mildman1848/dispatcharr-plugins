name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JSON and catalog schema
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python -m json.tool catalog.json >/dev/null
          python -m jsonschema -i catalog.json catalog.schema.json
